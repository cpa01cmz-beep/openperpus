  /api/settings/theme:
    put:
      summary: Update theme (admin-only, layout-only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active_theme:
                  type: string
                  enum: [emerald, midnight, paper, brutalist, ocean, sketch]
                  description: Base theme id (admin-only)
                theme_overrides:
                  type: object
                  description: Layout-only overrides ({layout:{headerVariant,heroVariant,footerVariant,homepageSections}}); tokens/fonts/radius/shadow/spacing rejected 422
                  properties:
                    layout:
                      type: object
                      properties:
                        headerVariant:
                          type: string
                        heroVariant:
                          type: string
                        footerVariant:
                          type: string
                        homepageSections:
                          type: array
                          items:
                            type: object
                reset:
                  type: boolean
                  description: When true clears theme_overrides
      responses:
        '200':
          description: ok
        '403':
          description: THEME_FORBIDDEN (librarian) or FORBIDDEN (non-staff)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation or HINT_USE_THEME_ENDPOINT (theme keys sent to PUT /api/settings)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
