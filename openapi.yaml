openapi: 3.1.0
info:
  title: OpenPerpus API
  version: 0.1.0
  description: CMS Perpustakaan — 31 route modules (26 resource + health/readyz/docs/metrics/register). Deploy stays Cloudflare Workers; Docker is local preview/CI only. Enforced bidirectionally by tests/openapi-conformance.test.ts.
servers:
  - url: http://localhost:3000
    description: local
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token (JWT) from client-side auth; browser sessions use cookies equivalently
  schemas:
    ErrorResponse:
      type: object
      description: Error envelope emitted by jsonError (src/lib/http-error.ts). details is a SIBLING of error, never nested inside it.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION,
                  NOT_FOUND,
                  CONFLICT,
                  UNAUTHORIZED,
                  FORBIDDEN,
                  INTERNAL,
                  SAVE_FAILED,
                  FETCH_FAILED,
                  DELETE_FAILED,
                  INVALID_JSON,
                  BAD_REQUEST,
                  SPAM_DETECTED,
                  RATE_LIMITED,
                  GONE,
                  CSRF_MISMATCH,
                ]
            message:
              type: string
        details:
          description: Optional machine-readable detail payload (sibling of error)
      required: [error]
    PaginatedResponse:
      type: object
      description: Shared list envelope used by paginated collection GETs
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          required: [page, per_page, total]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
        pagination:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
      required: [data, meta, pagination]
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        content_md:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        category:
          type: string
          nullable: true
        cover_url:
          type: string
          nullable: true
        author_id:
          type: string
          format: uuid
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        views:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [id, title, slug, content_md, status]
    Banner:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        image_url:
          type: string
        link:
          type: string
          nullable: true
        is_active:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [id, title, image_url, is_active, sort_order]
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number
    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Items per page (articles/banners/books/members/loans default 10; other collections default 20)
paths:
  /api/health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptime:
                    type: number
  /api/readyz:
    get:
      summary: Readiness probe (Supabase ping)
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema:
                type: object
                required: [ready, checks]
                properties:
                  ready:
                    type: boolean
                    enum: [true]
                  checks:
                    type: object
                    required: [supabase, latencyMs]
                    properties:
                      supabase:
                        type: string
                        enum: [ok]
                      latencyMs:
                        type: number
        '503':
          description: not ready
          content:
            application/json:
              schema:
                type: object
                required: [ready, checks]
                properties:
                  ready:
                    type: boolean
                    enum: [false]
                  checks:
                    type: object
                    required: [supabase]
                    properties:
                      supabase:
                        type: string
                        enum: [error]
                      detail:
                        type: string
  /api/metrics:
    get:
      summary: Prometheus metrics endpoint (Bearer METRICS_TOKEN when METRICS_TOKEN is set)
      responses:
        '200':
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid METRICS_TOKEN bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/docs:
    get:
      summary: Scalar/Swagger UI for this contract
      responses:
        '200':
          description: html
  /api/articles:
    get:
      summary: List articles (staff)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      summary: Create article (staff)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content_md]
              properties:
                title:
                  type: string
                slug:
                  type: string
                  description: Optional; slugified from title when omitted or blank (auto-unique, 409 on conflict)
                excerpt:
                  type: string
                  description: 'Optional (alias: ringkasan)'
                content_md:
                  type: string
                  description: 'Markdown body (aliases: konten, content)'
                status:
                  type: string
                  enum: [draft, published, archived]
                  default: draft
                category:
                  type: string
                cover_url:
                  type: string
                  description: 'Alias: gambar_url'
      responses:
        '201':
          description: Created article
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Article'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slug already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update article (staff, ?id=)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
    delete:
      summary: Delete article (admin, ?id=)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
  /api/banners:
    get:
      summary: List banners (staff; public site uses helper lib)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated banners
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      summary: Create banner (staff)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, image_url]
              properties:
                title:
                  type: string
                subtitle:
                  type: string
                image_url:
                  type: string
                link:
                  type: string
                  description: 'Target URL (alias: link_url)'
                sort_order:
                  type: integer
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Banner'
                  revalidated:
                    type: array
                    items:
                      type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update banner (staff, ?id=)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
    delete:
      summary: Delete banner (admin, ?id=)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
