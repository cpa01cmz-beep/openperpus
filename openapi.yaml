      responses:
        '200':
          description: ok
    post:
      summary: Issue fine (staff)
      responses:
        '201':
          description: created
  /api/fines/{id}:
    get:
      summary: Get fine by id
      responses:
        '200':
          description: ok
  /api/fines/{id}/pay:
    post:
      summary: Pay fine
      responses:
        '200':
