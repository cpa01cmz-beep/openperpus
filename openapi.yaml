openapi: 3.1.0
info:
  title: OpenPerpus API
  version: 0.1.0
  description: CMS Perpustakaan — 35 route handler (30 resource + health/readyz/docs/metrics/register). Deploy utama Vercel (ADR-002), Cloudflare Workers alternatif; preview lokal via `npm run dev` / `npm run cf:preview`. Enforced bidirectionally by tests/openapi-conformance.test.ts.
servers:
  - url: http://localhost:3000
    description: local
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token (JWT) from client-side auth; browser sessions use cookies equivalently
  schemas:
    ErrorResponse:
      type: object
      description: Error envelope emitted by jsonError (src/lib/http-error.ts). details is a SIBLING of error, never nested inside it.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION,
                  NOT_FOUND,
                  CONFLICT,
                  UNAUTHORIZED,
                  FORBIDDEN,
                  THEME_FORBIDDEN,
                  HINT_USE_THEME_ENDPOINT,
                  INTERNAL,
                  SAVE_FAILED,
                  FETCH_FAILED,
                  DELETE_FAILED,
                  INVALID_JSON,
                  BAD_REQUEST,
                  SPAM_DETECTED,
                  RATE_LIMITED,
                  GONE,
                  CSRF_MISMATCH,
                  MEMBER_HAS_FINES,
                  MEMBER_OVERDUE,
                  MEMBER_LOAN_LIMIT,
                  MEMBER_CHECK_FAILED,
                ]
            message:
              type: string
        details:
          description: Optional machine-readable detail payload (sibling of error)
      required: [error]
    PaginatedResponse:
      type: object
      description: >-
        Shared list envelope used by paginated collection GETs. Single shape
        after issue #61 — `pagination` only, `meta` was removed.
      properties:
        data:
          type: array
          items:
            type: object
        pagination:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
      required: [data, pagination]
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        content_md:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        category:
          type: string
          nullable: true
        cover_url:
          type: string
          nullable: true
        author_id:
          type: string
          format: uuid
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        views:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [id, title, slug, content_md, status]
    Banner:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        image_url:
          type: string
        link:
          type: string
          nullable: true
        is_active:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [id, title, image_url, is_active, sort_order]
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number
    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Items per page (articles/banners/books/members/loans default 10; other collections default 20)
paths:
  /api/health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptime:
                    type: number
  /api/readyz:
    get:
      summary: Readiness probe (Supabase ping)
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema:
                type: object
                required: [ready, checks]
                properties:
                  ready:
                    type: boolean
                    enum: [true]
                  checks:
                    type: object
                    required: [supabase, latencyMs]
                    properties:
                      supabase:
                        type: string
                        enum: [ok]
                      latencyMs:
                        type: number
        '503':
          description: not ready
          content:
            application/json:
              schema:
                type: object
                required: [ready, checks]
                properties:
                  ready:
                    type: boolean
                    enum: [false]
                  checks:
                    type: object
                    required: [supabase]
                    properties:
                      supabase:
                        type: string
                        enum: [error]
                      detail:
                        type: string
  /api/metrics:
    get:
      summary: Prometheus metrics endpoint (Bearer METRICS_TOKEN when METRICS_TOKEN is set)
      responses:
        '200':
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid METRICS_TOKEN bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/docs:
    get:
      summary: Scalar/Swagger UI for this contract
      responses:
        '200':
          description: html
  /api/articles:
    get:
      summary: List articles (public published; draft/archived staff)
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      summary: Create article (staff)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content_md]
              properties:
                title:
                  type: string
                slug:
                  type: string
                  description: Optional; slugified from title when omitted or blank (auto-unique, 409 on conflict)
                excerpt:
                  type: string
                  description: 'Optional (alias: ringkasan)'
                content_md:
                  type: string
                  description: 'Markdown body (aliases: konten, content)'
                status:
                  type: string
                  enum: [draft, published, archived]
                  default: draft
                category:
                  type: string
                cover_url:
                  type: string
                  description: 'Alias: gambar_url'
      responses:
        '201':
          description: Created article
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Article'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slug already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/articles/{id}:
    get:
      summary: Get article by id (public when published; staff otherwise)
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: ok
        '400':
          description: Invalid id (not a UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update article (staff)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
        '400':
          description: Invalid id (not a UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slug already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete article (admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
        '400':
          description: Invalid id (not a UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/banners:
    get:
      summary: List banners (staff; public site uses helper lib)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated banners
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      summary: Create banner (staff)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, image_url]
              properties:
                title:
                  type: string
                subtitle:
                  type: string
                image_url:
                  type: string
                link:
                  type: string
                  description: 'Target URL (alias: link_url)'
                sort_order:
                  type: integer
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Banner'
                  revalidated:
                    type: array
                    items:
                      type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/banners/{id}:
    get:
      summary: Get banner by id (public when active; staff otherwise)
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: ok
        '400':
          description: Invalid id (not a UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update banner (staff)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
        '400':
          description: Invalid id (not a UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete banner (admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
        '400':
          description: Invalid id (not a UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/books:
    get:
      summary: List books (public, paginated; RLS is_active)
      responses:
        '200':
          description: ok
    post:
      summary: Create book (staff)
      security:
        - BearerAuth: []
      responses:
        '201':
          description: created
    put:
      summary: Stock opname bulk (staff)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
    delete:
      summary: Bulk delete books (staff)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
  /api/books/{id}:
    get:
      summary: Get book by id (public; RLS enforces active)
      responses:
        '200':
          description: ok
    put:
      summary: Update book (staff)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
    delete:
      summary: Delete book (admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
  /api/categories:
    get:
      summary: List categories (public; ?all=1 staff elevation)
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: ok
    post:
      summary: Create category (staff)
      security:
        - BearerAuth: []
      responses:
        '201':
          description: created
  /api/categories/{id}:
    get:
      summary: Get category by id (public when active; staff otherwise)
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: ok
    put:
      summary: Update category (staff)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
    delete:
      summary: Delete category (admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
  /api/faqs:
    get:
      summary: List faqs (public; ?all=1 staff elevation)
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: ok
    post:
      summary: Create faq (staff)
      security:
        - BearerAuth: []
      responses:
        '201':
          description: created
  /api/faqs/{id}:
    get:
      summary: Get faq by id (public when active; staff otherwise)
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: ok
    put:
      summary: Update faq (staff)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
    delete:
      summary: Delete faq (admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
  /api/fines:
    get:
      summary: List fines (auth required; members scoped to own)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: ok
        '401':
          description: Silakan login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Issue fine (staff)
      security:
        - BearerAuth: []
      responses:
        '201':
          description: created
  /api/fines/{id}:
    get:
      summary: Get fine by id (auth required; owner or staff)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
        '401':
          description: Silakan login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/fines/{id}/pay:
    post:
      summary: Pay fine (auth required; staff or owner of the fine)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: >-
            ok — response is {data: fine, payment: immutable receipt row with
            receipt_no, revalidated}
        '401':
          description: Silakan login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Denda sudah lunas/dibebaskan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Nominal melebihi sisa denda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/fines/{id}/waive:
    post:
      summary: Request fine waiver (staff; step 1 of 2, issue #72)
      description: >-
        Reason required (min 10 chars). The request lands in fine_waivers with
        requested_by recorded; approval/rejection by a DIFFERENT admin happens
        via POST /api/fines/waivers/{id}/decision.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '201':
          description: created — waiver row awaiting approval
        '400':
          description: Body JSON tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Denda sudah lunas/dibebaskan atau pengajuan sudah menunggu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Alasan wajib diisi minimal 10 karakter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/fines/waivers/{id}/decision:
    post:
      summary: Approve/reject fine waiver (admin; approver must differ from requester)
      description: >-
        Step 2 of the two-step fine waiver (#72). Segregation of duties:
        only admin may decide and the approver cannot be the requester of the
        waiver (self-approval → 403, also enforced by a DB CHECK constraint).
        Approving moves the fine to status 'waived'.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - approve
              properties:
                approve:
                  type: boolean
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: ok — decided waiver row
        '403':
          description: Hanya admin, dan bukan pengajunya sendiri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Pengajuan sudah diputuskan / denda berubah status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: approve wajib boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/loans:
    get:
      summary: List loans (staff; members see own)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          description: >-
            Column loans.status. 'overdue' is derived (still-active loan past
            due_at < NOW()), never persisted — equivalent to overdue=1.
          schema:
            type: string
            enum: [borrowed, returned, overdue, lost]
        - name: overdue
          in: query
          description: >-
            Derived late filter (single source of truth): status still active
            AND due_at < NOW(). Same result as status=overdue and the admin
            "Terlambat saja" toggle.
          schema:
            type: string
            enum: ['1']
        - name: member_id
          in: query
          description: Ignored for members (auto-scoped to own loans).
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Search in loan notes.
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
               schema:
                 type: object
                 required: [data, pagination]
                 properties:
                   data:
                     type: array
                     items:
                       type: object
                       properties:
                         is_overdue:
                           type: boolean
                           description: Derived late flag (active loan past due_at).
                         effective_status:
                           type: string
                           enum: [borrowed, overdue, returned, lost]
                           description: Display status — 'overdue' when derived, else the status column.
                         fine_preview:
                           type: number
                           description: Estimated fine at the configured per-day rate.
                   pagination:
                    type: object
                    required: [page, limit, total, totalPages]
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
    post:
      summary: Create loan (borrow, staff)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_id, book_id]
              properties:
                member_id:
                  type: string
                  format: uuid
                book_id:
                  type: string
                  format: uuid
                notes:
                  type: string
                borrowed_at:
                  type: string
                  format: date-time
                  description: Defaults to now.
                due_at:
                  type: string
                  format: date-time
                  description: >-
                    Defaults to borrowed_at + library_settings.loan_days
                    (14 days, migration 0026 / issue #74).
      responses:
        '201':
          description: created
        '409':
          description: 'Anggota tidak layak checkout: MEMBER_HAS_FINES (tagihan belum lunas), MEMBER_OVERDUE (pinjaman terlambat), MEMBER_LOAN_LIMIT (batas pinjaman aktif), atau CONFLICT (loan ganda/stok habis)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/loans/{id}:
    get:
      summary: Get loan by id (auth required; staff or owner)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
        '401':
          description: Silakan login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: 'Extend or return loan (action: extend|return, staff)'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [extend, return]
                days:
                  type: integer
                  minimum: 1
                  maximum: 90
                  description: 'action=extend: days to add to due_at'
                returned_at:
                  type: string
                  format: date-time
                  description: 'action=return: return timestamp'
                kondisi:
                  type: string
                  enum: [baik, rusak, hilang]
                  default: baik
                  description: >-
                    action=return: book condition (issue #74). Absent = 'baik'.
                    'rusak'/'hilang' reduce book stock and add a replacement fee
                    from library_settings.replacement_fee_damaged /
                    library_settings.replacement_fee_lost to the fine.
                notes:
                  type: string
      responses:
        '200':
          description: ok
    delete:
      summary: Delete loan (admin, only returned/lost)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
  /api/loans/{id}/return:
    post:
      summary: Return loan (staff)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
  /api/register:
    post:
      summary: Self member registration (public, pending activation)
      responses:
        '201':
          description: created pending
        '409':
          description: duplicate
        '422':
          description: validation
  /api/members:
    get:
      summary: List members (staff)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: ok
    post:
      summary: Create member (staff)
      security:
        - BearerAuth: []
      responses:
        '201':
          description: created
  /api/members/{id}:
    get:
      summary: Get member by id (staff)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
        '400':
          description: Invalid id (not a UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update member (staff; status/address/phone)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
        '400':
          description: Invalid id (not a UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete member (admin; 409 while active loans)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ok
        '400':
          description: Invalid id (not a UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Member still has active loans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/menus:
    get:
      summary: List menus (public; ?all=1 staff elevation)
      security:
        - BearerAuth: []
        - {}
      parameters:
