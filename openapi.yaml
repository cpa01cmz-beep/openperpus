openapi: 3.1.0
info:
  title: OpenPerpus API
  version: 0.1.0
  description: CMS Perpustakaan — 26 resource routes + observability (health/readyz/docs). Deploy stays Cloudflare Workers; Docker is local preview/CI only.
servers:
  - url: http://localhost:3000
    description: local
paths:
  /api/health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: ok
  /api/readyz:
    get:
      summary: Readiness probe (Supabase ping)
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /api/docs:
    get:
      summary: Scalar/Swagger UI for this contract
      responses:
        '200':
          description: html
  /api/articles:
    get:
      summary: List articles
      responses:
        '200':
          description: ok
    post:
      summary: Create article (staff)
      responses:
        '201':
          description: created
    put:
      summary: Bulk article ops (staff)
      responses:
        '200':
          description: ok
    delete:
