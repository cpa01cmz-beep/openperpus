name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint .

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # ponytail: 1 high (sharp via next, prod) per 2026-10 — level critical
      # agar blocking tapi hijau. Turunkan ke moderate bila sharp bersih.
      - run: npm audit --omit=dev --audit-level=critical

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run --project=unit --project=components

  # Issue #23: tiga suite tests/integration hanya pernah ter-skip karena CI
  # tidak pernah menjalankan project "integration". Job ini menjalankannya
  # terhadap Supabase nyata BILA kredensial tes disediakan:
  # - repo variable RUN_SUPABASE_INTEGRATION=true (secrets tidak bisa dipakai
  #   di job-level `if`, hanya `vars`/`github`/`needs` yang tersedia)
  # - secrets TEST_SUPABASE_URL / TEST_SUPABASE_ANON_KEY / TEST_SUPABASE_SERVICE_KEY
  # Tanpa toggle ini job dilewati (skip), jadi PR fork/berkontributor tetap hijau.
  # Hasil jatuh ke JUnit artifact + ringkasan step supaya muncul di test report.
  integration:
    if: ${{ vars.RUN_SUPABASE_INTEGRATION == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fail fast bila kredensial tes tidak lengkap
        run: |
          missing=0
          for v in TEST_SUPABASE_URL TEST_SUPABASE_ANON_KEY TEST_SUPABASE_SERVICE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v kosong — isi secrets atau set variable RUN_SUPABASE_INTEGRATION=false."
              missing=1
            fi
          done
          exit $missing
      - name: Jalankan suite integration (vitest --project=integration)
        run: >-
          npx vitest run --project=integration
          --reporter=default --reporter=junit --outputFile=test-results/integration-junit.xml
      - name: Ringkasan hasil ke step summary
        if: always()
        run: |
          {
            echo '### Integration suites (tests/integration)'
            echo ''
            if [ -f test-results/integration-junit.xml ]; then
              echo '```'
              node -e "
                const xml = require('node:fs').readFileSync('test-results/integration-junit.xml', 'utf8');
                const re = /<testsuite name=\"([^\"]+)\"[^>]*\btests=\"(\d+)\"[^>]*\bfailures=\"(\d+)\"[^>]*\berrors=\"(\d+)\"[^>]*\bskipped=\"(\d+)\"/g;
                let m, out = '';
                while ((m = re.exec(xml))) out += \`\${m[1]}: tests=\${m[2]} failures=\${m[3]} errors=\${m[4]} skipped=\${m[5]}\n\`;
                process.stdout.write(out || '(tidak ada testsuite dalam laporan)\n');
              "
              echo '```'
            else
              echo 'Laporan JUnit tidak dihasilkan (run gagal sebelum reporter menulis).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload laporan integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  playwright-list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright test --list

  # Issue #63: 5 journey admin + round-trip taxonomy/CMS hanya terdaftar oleh
  # playwright-list (--list) — TIDAK pernah dieksekusi. Job ini yang menjalankan
  # suite e2e terhadap backend nyata BILA kredensial disediakan (pola sama
  # dengan job integration di atas):
  # - repo variable RUN_E2E_ADMIN=true (vars, bukan secrets: secrets tak bisa
  #   dipakai di job-level `if`)
  # - secrets E2E_ADMIN_EMAIL / E2E_ADMIN_PASSWORD (akun staf di proyek test)
  # - secrets NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY /
  #   SUPABASE_SERVICE_ROLE_KEY agar `npm run dev` punya backend
  # Tanpa toggle ini job dilewati (skip), jadi PR tetap hijau. Journey tanpa
  # kredensial admin tetap self-skip aman di dalam spec.
  playwright-e2e:
    if: ${{ vars.RUN_E2E_ADMIN == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fail fast bila kredensial tes tidak lengkap
        run: |
          missing=0
          for v in E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD \
                   NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
                   SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v kosong — isi secrets atau set variable RUN_E2E_ADMIN=false."
              missing=1
            fi
          done
          exit $missing
      - name: Install browser Playwright (chromium saja — viewport tak dipakai journey)
        run: npx playwright install --with-deps chromium
      - name: Jalankan 5 journey admin + round-trip taxonomy/CMS
        run: >-
          npx playwright test tests/e2e/admin.spec.ts --project=chromium
          --reporter=line --reporter=junit --outputFile=test-results/e2e-junit.xml
      - name: Upload laporan e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

